# Serves the Flutter web build and proxies the API on the same origin.
# In production a host nginx (TLS) sits in front of this container.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Keep the scheme the host nginx saw (https), so the api can set Secure cookies.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 40m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf application/octet-stream;

  # Resolve the api container at request time so nginx starts even if the api is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # $http_host keeps the port, which the api's same-origin socket check compares with Origin.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_read_timeout 60s;
  }

  location /images/ {
    proxy_pass $api_upstream;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  # Flutter's file names are not content-hashed, so let browsers revalidate (ETag) every time.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  # Fonts and CanvasKit change only with a rebuild; cache them for a day.
  location ~* ^/(assets/fonts|canvaskit)/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }
}
