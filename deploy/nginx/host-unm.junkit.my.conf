# Example host nginx site for the VPS (TLS lives here, not in the containers).
# Put the map in the http {} block once per server if it is not there already.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name unm.junkit.my;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name unm.junkit.my;

  ssl_certificate     /etc/letsencrypt/live/unm.junkit.my/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unm.junkit.my/privkey.pem;

  # Six photos of up to 5 MB each per upload.
  client_max_body_size 40m;

  location / {
    proxy_pass http://127.0.0.1:8090;   # WEB_BIND in the deploy .env
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live chat (Socket.IO) needs the WebSocket upgrade.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
