name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to (re)deploy, e.g. an older commit SHA for a rollback. Leave empty to build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/junkit2003/unm-marketplace

jobs:
  api:
    name: API · lint and test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: unm_test
          MYSQL_USER: unm
          MYSQL_PASSWORD: unmpass
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  web:
    name: Web · analyze and test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    defaults:
      run:
        working-directory: src/unm_marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  images:
    name: Build images
    runs-on: ubuntu-24.04-arm
    needs: [api, web]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/unm_marketplace
          load: true
          tags: unm-marketplace-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Check nginx routing
        run: IMAGE=unm-marketplace-web:ci bash src/unm_marketplace/nginx/test.sh
      - name: Push web image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/unm_marketplace
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
      - name: Build and push api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/server
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to unm.junkit.my
    runs-on: ubuntu-latest
    needs: [images]
    # Runs after a green build on main, or straight away for a manual redeploy of an older tag.
    if: >-
      always() && !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://unm.junkit.my
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/apps/unm-marketplace' }}
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY are not set, so nothing was deployed. See docs/deploy-handoff.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose file and deploy script
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" compose.prod.yaml deploy/remote-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Deploy ${{ env.TAG }}
        if: steps.secrets.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash $DEPLOY_PATH/remote-deploy.sh '$TAG' '$GHCR_USER'"
